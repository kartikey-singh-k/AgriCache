<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriCache | NGO Logistics Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1A73E8;
            --bg-color: #F8F9FA;
            --surface: #FFFFFF;
            --text-main: #202124;
            --border: #DADCE0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; height: 100vh; }
        
        /* Sidebar */
        .sidebar { width: 260px; background-color: #202124; color: white; padding: 2rem 1.5rem; display: flex; flex-direction: column; }
        .sidebar h2 { color: #8AB4F8; font-size: 1.5rem; margin-bottom: 2rem; }
        .nav-item { padding: 0.8rem; border-radius: 6px; background: rgba(255,255,255,0.1); cursor: pointer; border-left: 3px solid #8AB4F8; margin-bottom: 1rem; }
        
        /* Main Area */
        .main-content { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; }
        .card { background: var(--surface); padding: 2.5rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); border: 1px solid var(--border); width: 100%; max-width: 450px; }
        
        h3 { margin-bottom: 1.5rem; font-size: 1.4rem; }
        .input-group { margin-bottom: 1.2rem; }
        label { display: block; font-size: 0.85rem; font-weight: 600; color: #5F6368; margin-bottom: 0.5rem; text-transform: uppercase; }
        input { width: 100%; padding: 0.85rem 1rem; border-radius: 8px; border: 1px solid var(--border); font-size: 1rem; background-color: #FAFAFA; }
        input:focus { outline: none; border-color: var(--primary); background-color: var(--surface); }
        
        .btn-submit { background-color: var(--primary); color: white; border: none; padding: 1rem; font-size: 1rem; font-weight: 600; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 1rem; }
        .btn-submit:hover { background-color: #1557B0; }
        
        .alert { padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; display: none; font-size: 0.9rem; font-weight: 500; }
        .alert.error { background: #FCE8E6; color: #C5221F; border: 1px solid #FAD2CF; display: block; }
        .alert.success { background: #E6F4EA; color: #137333; border: 1px solid #CEE2D4; display: block; }

        /* Dashboard specific */
        #dashboard-view { display: none; width: 100%; max-width: 800px; justify-content: flex-start; align-items: flex-start; }
        .badge { display: inline-block; padding: 0.3rem 0.6rem; background: #E8F0FE; color: #1A73E8; border-radius: 4px; font-size: 0.8rem; font-weight: 600; margin-bottom: 1rem; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>🔐 AgriCache NGO</h2>
        <div class="nav-item">Supply Inventory</div>
        <div style="margin-top: auto;">
            <a href="/" style="color: #9AA0A6; text-decoration: none; font-size: 0.9rem;">← Back to Farmer Portal</a>
        </div>
    </div>

    <div class="main-content">
        <div class="card" id="login-view">
            <h3>Authorized Access Only</h3>
            <div id="login-alert" class="alert"></div>
            
            <div class="input-group">
                <label>NGO ID / Username</label>
                <input type="text" id="username" placeholder="e.g. kisan_patna">
            </div>
            <div class="input-group">
                <label>Security Password</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            <button class="btn-submit" onclick="attemptLogin()">Authenticate & Login</button>
        </div>

        <div class="card" id="dashboard-view" style="max-width: 600px;">
            <span class="badge">SECURE SESSION ACTIVE</span>
            <h3>Update Logistics Network</h3>
            <div id="dash-alert" class="alert"></div>
            
            <p style="color: #5F6368; font-size: 0.9rem; margin-bottom: 1.5rem;">
                Add new supplies to the routing database. The AI engine will immediately begin routing farmers to your facility if their crop disease matches this resource.
            </p>

            <div class="input-group">
                <label>Resource Type (Medicine/Tool)</label>
                <input type="text" id="resource_type" placeholder="e.g. Broad-Spectrum Fungicide">
            </div>
            <div class="input-group">
                <label>Quantity Available</label>
                <input type="text" id="quantity" placeholder="e.g. 500 Liters">
            </div>
            <button class="btn-submit" onclick="updateInventory()">Push to Logistics Network</button>
            
            <button onclick="logout()" style="background: transparent; border: none; color: #D93025; font-weight: 600; margin-top: 1.5rem; cursor: pointer; width: 100%;">Secure Logout</button>
        </div>
    </div>

    <script>
        // Check if already logged in
        if (localStorage.getItem('ngo_token')) {
            showDashboard();
        }

        async function attemptLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const alertBox = document.getElementById('login-alert');

            try {
                const res = await fetch('/api/ngo/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });
                
                const data = await res.json();
                
                if (data.success) {
                    localStorage.setItem('ngo_token', data.token);
                    showDashboard();
                } else {
                    alertBox.className = 'alert error';
                    alertBox.innerText = data.error || "Invalid Credentials";
                }
            } catch (err) {
                alertBox.className = 'alert error';
                alertBox.innerText = "Server connection failed.";
            }
        }

        async function updateInventory() {
            const resource = document.getElementById('resource_type').value;
            const qty = document.getElementById('quantity').value;
            const alertBox = document.getElementById('dash-alert');
            const token = localStorage.getItem('ngo_token');

            if(!resource || !qty) return;

            try {
                const res = await fetch('/api/ngo/update', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}` // Passing the JWT Security Token
                    },
                    body: JSON.stringify({ resource_type: resource, quantity: qty })
                });
                
                const data = await res.json();
                
                if (data.success) {
                    alertBox.className = 'alert success';
                    alertBox.innerText = data.message;
                    document.getElementById('resource_type').value = '';
                    document.getElementById('quantity').value = '';
                } else {
                    alertBox.className = 'alert error';
                    alertBox.innerText = data.error || "Session expired. Please log in again.";
                    if(res.status === 401 || res.status === 403) logout();
                }
            } catch (err) {
                alertBox.className = 'alert error';
                alertBox.innerText = "Failed to update database.";
            }
        }

        function showDashboard() {
            document.getElementById('login-view').style.display = 'none';
            document.getElementById('dashboard-view').style.display = 'block';
        }

        function logout() {
            localStorage.removeItem('ngo_token');
            document.getElementById('login-view').style.display = 'block';
            document.getElementById('dashboard-view').style.display = 'none';
            document.getElementById('login-alert').style.display = 'none';
        }
    </script>
</body>
</html>
